<main>
  <h1>Buscar endereço pelo CEP</h1>

  <form (submit)="$event.preventDefault(); buscar()">
    <label for="cep">CEP</label>
    <div class="linha">
      <input 
        id="cep"
        inputmode="numeric"
        placeholder="Ex.: 01001000"
        [value]="cep()"
        (input)="aoDigitar($event)"
      />
      <button 
        type="submit"
        [disabled]="carregando()">Buscar
      </button>
      <button 
        type="button"
        class="secundario"
        (click)="limpar()">Limpar
      </button>
    </div>
  </form>

  <!-- Os 3 estados da tela-->
   @if(carregando()){ <!--Carregando-->
    <p class="info">Consultando a API ViaCEP</p>
   }@else if(erro()){ <!--Erro-->
    <p class="erro">{{ erro() }}</p>
   }@else if(endereco()){
     @let end = endereco()!;
     <section class="cartao">
        <h2>{{ end.logradouro }}</h2>
        <dl>
          <dt>CEP</dt><dd>{{end.cep}}</dd>
          <dt>Bairro</dt><dd>{{end.bairro}}</dd>
          <dt>Cidade</dt><dd>{{end.localidade}} / {{end.uf}}</dd>
          <dt>DDD</dt><dd>{{end.ddd}}</dd>
        </dl>
     </section>
   }


</main>
